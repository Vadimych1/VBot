<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VBot Control Panel</title>

    <style>
        body {
            padding: 0; 
            margin: 0; 
            inset: 0; 
            display: flex; 
            flex-direction: row;
            font-family: sans-serif;
        }

        .left-side {
            background-color: white; 
            height: min(100vh, 100vw); 
            width: min(100vh, 100vw);
        }

        .right-side {
            width: 100%; 
            padding-left: 20px;
        }


        .orders-list {
            display: flex;
            flex-wrap: wrap;
            flex-direction: row;
        }

        .order {
            box-shadow: 1px 1px 10px gray;
            padding: 10px 20px;
        }

        .order-items {
            list-style: disc;
            padding-left: 30px;
        }

        .order button {
            background-color: rgb(235, 75, 75);
            color: #fff;
            font-size: 15px;
            padding: 7px 15px;
            border: none;
            outline: none;
            box-shadow: 2px 2px 10px gray;

            transition: 0.3s;
        }

        .order button:hover {
            cursor: pointer;
            filter: brightness(0.94);
        }
    </style>
</head>
<body>
    <canvas class="left-side" width="1000" height="1000"></canvas>
    <div class="right-side">
        <div class="orders">
            <h1>Orders</h1>

            <div class="orders-list">
                
            </div>
            

            <h2>New order</h2>
            <form class="order-form" action="order"></form>
        </div>

        <hr>

        <div class="loads">
            <div class="load"></div>

            <form class="load-form" action="order"></form>
        </div>

        <hr>

        <div class="connected-robots"></div>
    </div>

    <noscript>Ваш браузер не поддерживает JS. Для продолжения работы используйте другой браузер или обновите этот.</noscript>
</body>
<script>
    const host = window.location.host

    const cvs = document.querySelector("canvas");
    const ctx = cvs.getContext("2d");

    async function request(path, type = "json") {
        if (path.startsWith("/")) path = path.slice(1)

        let req = await fetch("http://" + host + "/" +path)

        switch (type) {
            case "json":
                return await req.json()
            
            case "plain":
                return await req.text()

            case "bytes":
                return await req.blob()
        }
    }

    ctx.font = "30px sans-serif"

    const offset = 70;
    let state = {
        "nrobots": 0,
        "robots": [],
        "map": null,
        "orders": []
    };

    let n = 0
    function draw(mmPerPixel = 1, dots = []) {
        if (n % 2 == 0) {
            //request("robots").then(
            //    (data) => {
            //        state.robots = data
            //    }
            //)
            request("map", "plain").then(
                (data) => {
                    let image = new Image();
                    image.src = data
                    state.map = image
                }
            )
            request("get_count").then(
                (data) => {
                    state.nrobots = data
                }
            )
            request("orders").then(
                (data) => {
                    state.orders = data
                    rebuild_orders()
                }
            )
        }

        n += 1
        
        ctx.clearRect(0, 0, cvs.width, cvs.height);

        if (state) {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, cvs.width, offset)
            ctx.fillStyle = "white";
            ctx.fillText("Address: " + host + " | ", 10, offset - 25);
            ctx.fillText("Robots count: " + state.nrobots + " | ", 20 + ctx.measureText("Address: " + host + " | ").width, offset - 25);

            if (state.map != null || state.map) {
                ctx.drawImage(state.map, 0, offset, cvs.height - offset, cvs.height - offset);
            } else {
                let gradient = ctx.createLinearGradient(0, 0, 100, 100);
                gradient.addColorStop(0, "pink");
                gradient.addColorStop(0.5, "yellow");
                gradient.addColorStop(1, "blue");
                ctx.fillStyle = gradient;

                ctx.fillRect(0, offset, cvs.height - offset, cvs.height - offset);
            }
        }
    }

    function cancel_order(id) {} // todo

    function rebuild_orders() {
        let orders = document.querySelector(".orders-list");
        orders.innerHTML = "";

        for (let order_e of state.orders) {
            const elem = order(order_e[0], order_e[1], []);
            orders.appendChild(elem);
        }
    }

    function order(id = "", to = "", items = []) {
        const order = document.createElement("div");
        order.className = "order";

        const order_id = document.createElement("p");
        order_id.className = "order-id";
        order_id.innerText = "ID: " + id;
        order.appendChild(order_id);

        const order_items = document.createElement("ul");
        order_items.className = "order-items";
        order.appendChild(order_items);

        for (const order_item_t of items) {
            const order_item = document.createElement("li");
            order_item.innerText = order_item_t;
            order_items.appendChild(order_item);
        }

        const order_to = document.createElement("p");
        order_to.className = "order-to";
        order_to.innerText = "Ordered to: " + to;
        order.appendChild(order_to);

        const cancel_order = document.createElement("button");
        cancel_order.innerText = "Cancel";
        cancel_order.onclick = function () {cancel_order(id)};

        return order
    }

    setInterval(draw, 300);
